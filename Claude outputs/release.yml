# Builds RemoteFlow for Windows and Linux when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3)
# and creates a DRAFT release on GitHub with the installers, their updater signatures and latest.json.
# Publishing the draft (Releases → Edit → Publish) makes it available to the in-app updater.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           – content of the private key file (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  – its password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version and the updater key is set
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json (see README – Releases)"; exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: `RemoteFlow ${process.env.GITHUB_REF_NAME}`,
              body: fs.readFileSync('release-notes.md', 'utf8'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # Ubuntu 22.04: older glibc, so the Linux packages run on more distributions
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file patchelf libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Release notes (CHANGELOG section – also shown by the in-app updater)
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo 'body<<RF_NOTES_EOF'
            node scripts/release-notes.mjs "$VERSION"
            echo 'RF_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (AppImage) cannot use FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: node scripts/check-i18n.mjs && npm run build
      - run: cargo test --lib --locked
        working-directory: src-tauri
